<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switching Circuit V2 — Connection Verification</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #f5f5f5;
    --text-dim: #a0a0b8;
    --green: #00e676;
    --green-dim: #1b5e20;
    --red: #ff1744;
    --red-dim: #b71c1c;
    --gray: #555;
    --amber: #ffc107;
    --blue: #448aff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--surface2);
    flex-shrink: 0;
  }
  #toolbar h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .progress-bar {
    flex: 1;
    max-width: 300px;
    height: 8px;
    background: var(--gray);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    transition: width 0.3s;
  }
  .progress-text { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .toolbar-btn {
    padding: 4px 12px;
    background: var(--surface2);
    border: 1px solid var(--gray);
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
  }
  .toolbar-btn:hover { background: var(--blue); border-color: var(--blue); }
  #filter-select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--gray);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
  }
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  #sidebar {
    width: 380px;
    min-width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--surface2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #conn-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px;
  }
  #conn-list::-webkit-scrollbar { width: 6px; }
  #conn-list::-webkit-scrollbar-thumb { background: var(--gray); border-radius: 3px; }
  .group-header {
    font-size: 11px;
    font-weight: 700;
    color: var(--blue);
    padding: 8px 8px 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .conn-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .conn-item:hover { background: rgba(255,255,255,0.07); }
  .conn-item.selected { border-color: var(--blue); background: rgba(68,138,255,0.15); }
  .conn-item.st-approved { background: rgba(0,230,118,0.07); border-left: 3px solid var(--green); }
  .conn-item.st-approved .conn-label { color: #c8f7d5; }
  .conn-item.st-flagged { background: rgba(255,23,68,0.1); border-left: 3px solid var(--red); }
  .conn-item.st-flagged .conn-label { color: #ffaaaa; }
  .conn-item.st-unchecked { border-left: 3px solid transparent; }
  .conn-item.st-unchecked .conn-label { color: #888; }
  .conn-item .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid;
  }
  .conn-item .status-dot.unchecked { background: var(--gray); border-color: #777; }
  .conn-item .status-dot.approved { background: var(--green); border-color: var(--green); box-shadow: 0 0 6px var(--green); }
  .conn-item .status-dot.flagged { background: var(--red); border-color: var(--red); box-shadow: 0 0 6px var(--red); animation: pulse-red 1.5s infinite; }
  @keyframes pulse-red { 0%,100% { box-shadow: 0 0 4px var(--red); } 50% { box-shadow: 0 0 12px var(--red); } }
  .conn-item .conn-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .conn-item .conn-net { font-size: 10px; color: var(--text-dim); }

  #graph-area {
    flex: 1;
    position: relative;
  }
  #graph-container { width: 100%; height: 100%; }

  #detail-panel {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 400px;
    max-height: calc(100% - 32px);
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: 8px;
    padding: 16px;
    display: none;
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    z-index: 10;
  }
  #detail-panel.visible { display: block; }
  #detail-panel h2 { font-size: 16px; margin-bottom: 10px; color: #fff; }
  #detail-panel .detail-section { margin-bottom: 14px; }
  #detail-panel .detail-label { font-size: 11px; color: var(--amber); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600; }
  #detail-panel .detail-value { font-size: 13px; line-height: 1.6; color: #ddd; }
  #detail-panel .net-badge {
    display: inline-block;
    padding: 2px 8px;
    background: var(--surface2);
    border-radius: 3px;
    font-size: 12px;
    color: var(--amber);
    margin: 2px 0;
    font-weight: 600;
  }
  #detail-panel .pin-info { color: #82b1ff; font-size: 13px; font-weight: 600; }
  .datasheet-link {
    display: inline-block;
    padding: 3px 10px;
    background: var(--surface2);
    border: 1px solid var(--blue);
    border-radius: 4px;
    color: var(--blue);
    text-decoration: none;
    font-size: 12px;
    margin: 2px 4px 2px 0;
    transition: all 0.15s;
  }
  .datasheet-link:hover { background: var(--blue); color: #fff; }
  .status-buttons { display: flex; gap: 8px; margin-top: 12px; }
  .status-btn {
    flex: 1;
    padding: 8px;
    border: 2px solid;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .status-btn.approve { border-color: var(--green); color: var(--green); background: transparent; }
  .status-btn.approve:hover, .status-btn.approve.active { background: var(--green); color: #000; }
  .status-btn.flag { border-color: var(--red); color: var(--red); background: transparent; }
  .status-btn.flag:hover, .status-btn.flag.active { background: var(--red); color: #fff; }
  .status-btn.reset { border-color: var(--gray); color: var(--text-dim); background: transparent; }
  .status-btn.reset:hover { background: var(--gray); color: #fff; }
  #detail-notes {
    width: 100%;
    min-height: 60px;
    background: var(--bg);
    border: 1px solid var(--gray);
    border-radius: 4px;
    color: var(--text);
    padding: 8px;
    font-family: inherit;
    font-size: 11px;
    resize: vertical;
    margin-top: 4px;
  }
  .close-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
  }
  .close-btn:hover { color: var(--text); }
  .legend {
    display: flex;
    gap: 16px;
    font-size: 10px;
    color: var(--text-dim);
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>SCV2 Connection Verification</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--gray)"></div>Unchecked</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green);box-shadow:0 0 4px var(--green)"></div>Approved</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red);box-shadow:0 0 4px var(--red)"></div>Flagged</div>
  </div>
  <select id="filter-select">
    <option value="all">All Groups</option>
  </select>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <span class="progress-text" id="progress-text">0 / 0</span>
  <button class="toolbar-btn" onclick="saveState()">Save JSON</button>
  <button class="toolbar-btn" onclick="document.getElementById('load-input').click()">Load JSON</button>
  <input type="file" id="load-input" accept=".json" style="display:none" onchange="loadState(event)">
</div>

<div id="main">
  <div id="sidebar">
    <div id="conn-list"></div>
  </div>
  <div id="graph-area">
    <div id="graph-container"></div>
    <div id="detail-panel">
      <button class="close-btn" onclick="closeDetail()">&times;</button>
      <h2 id="detail-title"></h2>
      <div class="detail-section">
        <div class="detail-label">Connection</div>
        <div class="detail-value" id="detail-pins"></div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Net</div>
        <div class="detail-value" id="detail-net"></div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Why This Connection Is Correct</div>
        <div class="detail-value" id="detail-rationale"></div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Specs / Verification</div>
        <div class="detail-value" id="detail-specs"></div>
      </div>
      <div class="detail-section" id="detail-datasheet-section" style="display:none">
        <div class="detail-label">Datasheets</div>
        <div class="detail-value" id="detail-datasheets"></div>
      </div>
      <div class="status-buttons">
        <button class="status-btn approve" onclick="setStatus('approved')">Approve</button>
        <button class="status-btn flag" onclick="setStatus('flagged')">Flag Issue</button>
        <button class="status-btn reset" onclick="setStatus('unchecked')">Reset</button>
      </div>
      <div class="detail-section" style="margin-top:12px">
        <div class="detail-label">Notes</div>
        <textarea id="detail-notes" placeholder="Add verification notes..." oninput="saveNotes()"></textarea>
      </div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONNECTION DATA — every verifiable connection on the V2 PCB
// ─────────────────────────────────────────────────────────────────────────────

const CONNECTIONS = [

// ── Power Input Protection ──────────────────────────────────────────────────
{
  id:'pwr_01', group:'Power Input', label:'J1 → F1 (Cycler+)',
  from:'J1', fromPins:'1,2', to:'F1', toPins:'1', net:'CYCLER_IN+',
  rationale:'Cycler positive input enters via screw terminal J1 (pins 1+2 ganged for current capacity) and feeds directly into polyfuse F1 for overcurrent protection. The doubled pins handle the 3A continuous current without exceeding terminal ratings.',
  specs:'F1: PPTC polyfuse, 3A hold / 6A trip, 1812 package. Verify < 50 mΩ continuity from J1 pin 1 to F1 pad 1.'
},
{
  id:'pwr_02', group:'Power Input', label:'F1 → Q_RP (post-fuse)',
  from:'F1', fromPins:'2', to:'Q_RP', toPins:'2', net:'+HV_PREFUSE',
  rationale:'Post-fuse rail connects to the source of P-channel MOSFET Q_RP. In correct polarity, the P-ch gate is pulled low (to CYCLER_IN- ≈ GND) so Vgs is negative → FET conducts, passing +HV_PREFUSE through to +HV.',
  specs:'Q_RP: AO3401A (P-ch, SOT-23, Rds(on) 44mΩ @ Vgs=-4.5V). Pin 2 = Source. Verify continuity F1 pad 2 → Q_RP pin 2.'
},
{
  id:'pwr_03', group:'Power Input', label:'Q_RP gate bias (R_RP)',
  from:'R_RP', fromPins:'1', to:'R_RP', toPins:'2', net:'+HV_PREFUSE / GND',
  rationale:'R_RP pulls Q_RP gate to source (+HV_PREFUSE side) when no external drive is present. In normal operation, CYCLER_IN- ties to GND, so the gate sees ~0V while source sees +HV → Vgs < 0 → P-ch ON. If polarity is reversed, Vgs ≈ 0 → P-ch OFF, blocking reverse current.',
  specs:'R_RP: 10 kΩ, 0603. Pin 1 → +HV_PREFUSE, Pin 2 → GND. Verify 10 kΩ between Q_RP source and gate.'
},
{
  id:'pwr_04', group:'Power Input', label:'Q_RP drain → +HV',
  from:'Q_RP', fromPins:'3', to:'D_TVS', toPins:'2', net:'+HV',
  rationale:'Q_RP drain is the protected +HV rail output. All downstream power (shunts, FET drains) sources from this node. TVS diode clamps transients.',
  specs:'Verify continuity Q_RP pin 3 (drain) to +HV rail. Should read < 1Ω when Q_RP is conducting (correct polarity applied).'
},
{
  id:'pwr_05', group:'Power Input', label:'D_TVS (+HV clamp)',
  from:'D_TVS', fromPins:'1,2', to:'D_TVS', toPins:'1,2', net:'+HV / GND',
  rationale:'Bidirectional TVS diode clamps +HV rail transients. 12V standoff allows normal cycler voltages (2.65–10V) while clamping spikes from inductive loads or hot-plugging.',
  specs:'SMBJ12CA: 12V standoff, 19.9V clamping @ 1A. SMB package. Pin 1 = GND, Pin 2 = +HV. Should read open-circuit in both directions at < 12V.'
},
{
  id:'pwr_06', group:'Power Input', label:'C_BULK1 (+HV bulk)',
  from:'C_BULK1', fromPins:'1,2', to:'C_BULK1', toPins:'1,2', net:'+HV / GND',
  rationale:'10 µF bulk capacitor absorbs low-frequency ripple and provides local charge reservoir for the switching FETs.',
  specs:'10 µF, X5R, 25V, 0805. Pin 1 = +HV, Pin 2 = GND.'
},
{
  id:'pwr_07', group:'Power Input', label:'C_BULK2 (+HV HF bypass)',
  from:'C_BULK2', fromPins:'1,2', to:'C_BULK2', toPins:'1,2', net:'+HV / GND',
  rationale:'100 nF ceramic bypasses high-frequency noise on the +HV rail, complementing the 10 µF bulk cap.',
  specs:'100 nF, X7R, 25V, 0603. Pin 1 = +HV, Pin 2 = GND.'
},
{
  id:'pwr_08', group:'Power Input', label:'J1 → R_CYC_GND (Cycler−)',
  from:'J1', fromPins:'3,4', to:'R_CYC_GND', toPins:'1', net:'CYCLER_IN-',
  rationale:'Cycler negative enters J1 pins 3+4 (ganged). Kept as a separate net from GND — not every cycler is earth-referenced. Tied to GND through R_CYC_GND.',
  specs:'Verify continuity J1 pin 3 → R_CYC_GND pad 1.'
},
{
  id:'pwr_09', group:'Power Input', label:'R_CYC_GND (neg tie)',
  from:'R_CYC_GND', fromPins:'1,2', to:'R_CYC_GND', toPins:'1,2', net:'CYCLER_IN- / GND',
  rationale:'0Ω resistor ties CYCLER_IN- to system GND. Can be removed (desoldered) if the cycler requires a floating negative return. 0805 package for easy rework.',
  specs:'0Ω, 0805. Verify < 1Ω between CYCLER_IN- and GND nets.'
},
{
  id:'pwr_10', group:'Power Input', label:'C_5V1 (5V bulk)',
  from:'C_5V1', fromPins:'1,2', to:'C_5V1', toPins:'1,2', net:'+5V / GND',
  rationale:'10 µF bulk decoupling on the +5V rail (sourced from RP2040-Zero USB VBUS). Absorbs inrush from B0512S DC-DC converters.',
  specs:'10 µF, X5R, 16V, 0805. Pin 1 = +5V, Pin 2 = GND.'
},
{
  id:'pwr_11', group:'Power Input', label:'C_5V2 (5V HF bypass)',
  from:'C_5V2', fromPins:'1,2', to:'C_5V2', toPins:'1,2', net:'+5V / GND',
  rationale:'100 nF high-frequency bypass on +5V rail.',
  specs:'100 nF, X7R, 25V, 0603. Pin 1 = +5V, Pin 2 = GND.'
},

// ── Power Stage P1 (High-Side → CELL_A_POS) ────────────────────────────────
{
  id:'stg_p1_01', group:'Stage P1 (HS-A)', label:'R_SH_P1 (+HV → +HV_P1)',
  from:'R_SH_P1', fromPins:'1', to:'Q1', toPins:'3', net:'+HV / +HV_P1',
  rationale:'50 mΩ current sense shunt in the P1 high-side path. INA226 (U_INA_P1) measures voltage drop across this resistor. Pin 1 on the +HV side, Pin 2 on the +HV_P1 (FET drain) side.',
  specs:'0.05Ω ±1%, 1W, 2512 metal strip. At 3A → 150 mV drop, 450 mW dissipation. Verify 0.05Ω between +HV and +HV_P1.'
},
{
  id:'stg_p1_02', group:'Stage P1 (HS-A)', label:'Q1 (P1 FET)',
  from:'Q1', fromPins:'1,2,3', to:'Q1', toPins:'1,2,3', net:'GATE_P1_OUT / CELL_A_POS / +HV_P1',
  rationale:'N-channel MOSFET switches +HV_P1 rail to CELL_A_POS cell tab. Gate driven by UCC5304 U1 via 10Ω series resistor. High-side N-ch requires bootstrap/isolated gate supply (VCC2_P1 from PS1) to achieve Vgs > Vth above the source potential.',
  specs:'AO3400A: N-ch, SOT-23, Vds=30V, Id=5.8A, Rds(on)=20mΩ @ Vgs=4.5V. Pin 1=Gate (GATE_P1_OUT), Pin 2=Source (CELL_A_POS), Pin 3=Drain (+HV_P1).'
},
{
  id:'stg_p1_03', group:'Stage P1 (HS-A)', label:'Rgpd_1 (P1 gate pulldown)',
  from:'Rgpd_1', fromPins:'1,2', to:'Rgpd_1', toPins:'1,2', net:'GATE_P1_OUT / CELL_A_POS',
  rationale:'10 kΩ pulldown from Q1 gate to source (CELL_A_POS). Ensures FET stays OFF when the UCC5304 output is tri-stated or floating (e.g., during power-up before driver initializes).',
  specs:'10 kΩ, 0603. Pin 1 = GATE_P1_OUT, Pin 2 = CELL_A_POS. Verify 10 kΩ from Q1 gate to Q1 source.'
},

// ── Power Stage P2 (High-Side → CELL_B_POS) ────────────────────────────────
{
  id:'stg_p2_01', group:'Stage P2 (HS-B)', label:'R_SH_P2 (+HV → +HV_P2)',
  from:'R_SH_P2', fromPins:'1', to:'Q2', toPins:'3', net:'+HV / +HV_P2',
  rationale:'50 mΩ current sense shunt in the P2 high-side path. INA226 (U_INA_P2) measures voltage drop across this resistor.',
  specs:'0.05Ω ±1%, 1W, 2512 metal strip. Verify 0.05Ω between +HV and +HV_P2.'
},
{
  id:'stg_p2_02', group:'Stage P2 (HS-B)', label:'Q2 (P2 FET)',
  from:'Q2', fromPins:'1,2,3', to:'Q2', toPins:'1,2,3', net:'GATE_P2_OUT / CELL_B_POS / +HV_P2',
  rationale:'N-channel MOSFET switches +HV_P2 rail to CELL_B_POS cell tab. Gate driven by UCC5304 U2 via 10Ω series resistor. Isolated supply VCC2_P2 from PS2.',
  specs:'AO3400A: Pin 1=Gate (GATE_P2_OUT), Pin 2=Source (CELL_B_POS), Pin 3=Drain (+HV_P2).'
},
{
  id:'stg_p2_03', group:'Stage P2 (HS-B)', label:'Rgpd_2 (P2 gate pulldown)',
  from:'Rgpd_2', fromPins:'1,2', to:'Rgpd_2', toPins:'1,2', net:'GATE_P2_OUT / CELL_B_POS',
  rationale:'10 kΩ pulldown from Q2 gate to source (CELL_B_POS). Holds FET off when driver is floating.',
  specs:'10 kΩ, 0603. Pin 1 = GATE_P2_OUT, Pin 2 = CELL_B_POS.'
},

// ── Power Stage N1 (Low-Side ← CELL_A_NEG) ─────────────────────────────────
{
  id:'stg_n1_01', group:'Stage N1 (LS-A)', label:'Q3 (N1 FET)',
  from:'Q3', fromPins:'1,2,3', to:'Q3', toPins:'1,2,3', net:'GATE_N1_OUT / GND_N1 / CELL_A_NEG',
  rationale:'N-channel MOSFET switches CELL_A_NEG tab to GND via shunt R_SH_N1. Low-side FET — gate driven directly by UCC5304 U3 referenced to system GND. No isolated supply needed.',
  specs:'AO3400A: Pin 1=Gate (GATE_N1_OUT), Pin 2=Source (GND_N1), Pin 3=Drain (CELL_A_NEG).'
},
{
  id:'stg_n1_02', group:'Stage N1 (LS-A)', label:'R_SH_N1 (GND_N1 → GND)',
  from:'Q3', fromPins:'2', to:'R_SH_N1', toPins:'1', net:'GND_N1 / GND',
  rationale:'50 mΩ current sense shunt in the N1 low-side return path. INA226 (U_INA_N1) measures voltage drop across this resistor.',
  specs:'0.05Ω ±1%, 1W, 2512 metal strip. Pin 1 = GND_N1 (FET source side), Pin 2 = GND.'
},
{
  id:'stg_n1_03', group:'Stage N1 (LS-A)', label:'Rgpd_3 (N1 gate pulldown)',
  from:'Rgpd_3', fromPins:'1,2', to:'Rgpd_3', toPins:'1,2', net:'GATE_N1_OUT / GND_N1',
  rationale:'10 kΩ pulldown from Q3 gate to source (GND_N1). Holds FET off when driver is floating.',
  specs:'10 kΩ, 0603. Pin 1 = GATE_N1_OUT, Pin 2 = GND_N1.'
},

// ── Power Stage N2 (Low-Side ← CELL_B_NEG) ─────────────────────────────────
{
  id:'stg_n2_01', group:'Stage N2 (LS-B)', label:'Q4 (N2 FET)',
  from:'Q4', fromPins:'1,2,3', to:'Q4', toPins:'1,2,3', net:'GATE_N2_OUT / GND_N2 / CELL_B_NEG',
  rationale:'N-channel MOSFET switches CELL_B_NEG tab to GND via shunt R_SH_N2. Low-side FET — gate driven directly by UCC5304 U4.',
  specs:'AO3400A: Pin 1=Gate (GATE_N2_OUT), Pin 2=Source (GND_N2), Pin 3=Drain (CELL_B_NEG).'
},
{
  id:'stg_n2_02', group:'Stage N2 (LS-B)', label:'R_SH_N2 (GND_N2 → GND)',
  from:'Q4', fromPins:'2', to:'R_SH_N2', toPins:'1', net:'GND_N2 / GND',
  rationale:'50 mΩ current sense shunt in the N2 low-side return path. INA226 (U_INA_N2) measures voltage drop.',
  specs:'0.05Ω ±1%, 1W, 2512. Pin 1 = GND_N2, Pin 2 = GND.'
},
{
  id:'stg_n2_03', group:'Stage N2 (LS-B)', label:'Rgpd_4 (N2 gate pulldown)',
  from:'Rgpd_4', fromPins:'1,2', to:'Rgpd_4', toPins:'1,2', net:'GATE_N2_OUT / GND_N2',

function generateGraphEdges() {
  const nodeIds = new Set(GRAPH_NODES.map(n => n.id));
  const edgeMap = new Map();
  CONNECTIONS.forEach(c => {
    if (c.from === c.to) return;
    if (!nodeIds.has(c.from) || !nodeIds.has(c.to)) return;
    const key = [c.from, c.to].sort().join('|');
    if (!edgeMap.has(key)) {
      edgeMap.set(key, { from: c.from, to: c.to, nets: new Set(), connIds: [] });
    }
    const entry = edgeMap.get(key);
    c.net.split('/').forEach(n => entry.nets.add(n.trim().split('/')[0].trim()));
    entry.connIds.push(c.id);
  });
  return [...edgeMap.values()].map((e, i) => {
    const label = [...e.nets].slice(0, 2).join(', ');
    return { id: 'e' + i, from: e.from, to: e.to, label, connIds: e.connIds };
  });
}

let state = {};
let selectedId = null;
let network = null;

function initState() {
  const saved = localStorage.getItem('scv2_verification');
  if (saved) {
    try { state = JSON.parse(saved); } catch(e) { state = {}; }
  }
  CONNECTIONS.forEach(c => {
    if (!state[c.id]) state[c.id] = { status: 'unchecked', notes: '' };
  });
}

function persistState() {
  localStorage.setItem('scv2_verification', JSON.stringify(state));
}

  let lastGroup = '';
  CONNECTIONS.forEach(c => {
    if (filter && filter !== 'all' && c.group !== filter) return;
    if (c.group !== lastGroup) {
      lastGroup = c.group;
      const h = document.createElement('div');
      h.className = 'group-header';
      h.textContent = c.group;
      list.appendChild(h);
    }
    const item = document.createElement('div');
    const st = state[c.id]?.status || 'unchecked';
    item.className = 'conn-item st-' + st + (c.id === selectedId ? ' selected' : '');
    item.dataset.id = c.id;
    item.innerHTML = `
      <div class="status-dot ${st}"></div>
      <span class="conn-label">${c.label}</span>
      <span class="conn-net">${c.net.split('/')[0].trim()}</span>
    `;
    item.onclick = () => selectConnection(c.id);
    list.appendChild(item);
  });
}

function buildFilterOptions() {
  const sel = document.getElementById('filter-select');
  const groups = [...new Set(CONNECTIONS.map(c => c.group))];
  groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    sel.appendChild(opt);
  });
  sel.onchange = () => buildSidebar(sel.value);
}

// ─────────────────────────────────────────────────────────────────────────────
// DETAIL PANEL
// ─────────────────────────────────────────────────────────────────────────────

function selectConnection(id) {
  selectedId = id;
  const c = CONNECTIONS.find(x => x.id === id);
  if (!c) return;

  document.getElementById('detail-title').textContent = c.label;
  document.getElementById('detail-pins').innerHTML =
    `<span class="pin-info">${c.from} [${c.fromPins}]</span> → <span class="pin-info">${c.to} [${c.toPins}]</span>`;
  document.getElementById('detail-net').innerHTML =
    c.net.split('/').map(n => `<span class="net-badge">${n.trim()}</span>`).join(' ');
  document.getElementById('detail-rationale').textContent = c.rationale;
  document.getElementById('detail-specs').textContent = c.specs;
  document.getElementById('detail-notes').value = state[id]?.notes || '';

  // Datasheet links
  const sheets = getDatasheetsForConnection(c);
  const dsSection = document.getElementById('detail-datasheet-section');
  const dsContainer = document.getElementById('detail-datasheets');
  if (sheets.length > 0) {
    dsContainer.innerHTML = sheets.map(s =>
      `<a class="datasheet-link" href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`
    ).join('');
    dsSection.style.display = '';
  } else {
    dsSection.style.display = 'none';
  }

  const panel = document.getElementById('detail-panel');
  panel.classList.add('visible');

  // Update button active states
  const st = state[id]?.status || 'unchecked';
  document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
  if (st === 'approved') document.querySelector('.status-btn.approve').classList.add('active');
  if (st === 'flagged') document.querySelector('.status-btn.flag').classList.add('active');

  // Highlight in graph
  highlightGraphNode(c);

  // Update sidebar selection
  document.querySelectorAll('.conn-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
  selectedId = null;
  if (network) network.unselectAll();
  document.querySelectorAll('.conn-item').forEach(el => el.classList.remove('selected'));
}

function setStatus(status) {
  if (!selectedId) return;
  state[selectedId] = state[selectedId] || {};
  state[selectedId].status = status;
  persistState();
  updateProgress();
  updateGraphColors();
  const filter = document.getElementById('filter-select').value;
  buildSidebar(filter);
  selectConnection(selectedId);
}

function saveNotes() {
  if (!selectedId) return;
  state[selectedId] = state[selectedId] || {};
  state[selectedId].notes = document.getElementById('detail-notes').value;
  persistState();
}

// ─────────────────────────────────────────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────────────────────────────────────────

function updateProgress() {
  const total = CONNECTIONS.length;
  const approved = CONNECTIONS.filter(c => state[c.id]?.status === 'approved').length;
  const flagged = CONNECTIONS.filter(c => state[c.id]?.status === 'flagged').length;
  const pct = Math.round((approved / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent =
    `${approved}/${total} approved` + (flagged ? ` · ${flagged} flagged` : '');
  if (flagged > 0) {
    document.getElementById('progress-fill').style.background = 'var(--amber)';
  } else {
    document.getElementById('progress-fill').style.background = 'var(--green)';
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// GRAPH
// ─────────────────────────────────────────────────────────────────────────────

let nodesDS, edgesDS;

const GROUP_STYLES = {
  power:  {bg:'#4a1c1c', border:'#ff5722', font:13},
  shunt:  {bg:'#3e2723', border:'#a1887f', font:12},
  fet:    {bg:'#1b3a1b', border:'#4caf50', font:13},
  cell:   {bg:'#1a237e', border:'#7986cb', font:16},
  sensor: {bg:'#2a1540', border:'#ce93d8', font:13},
  driver: {bg:'#2a1030', border:'#f48fb1', font:13},
  supply: {bg:'#004d40', border:'#4db6ac', font:13},
  mcu:    {bg:'#1a3a5c', border:'#64b5f6', font:16},
  periph: {bg:'#263238', border:'#90a4ae', font:12},
  minor:  {bg:'#2d2d2d', border:'#999',    font:10},
  cap:    {bg:'#2a2a3a', border:'#7e7eaa', font:9},
  led:    {bg:'#2d3a1a', border:'#aed581', font:9},
  tp:     {bg:'#1a1a1a', border:'#666',    font:9},
};

function getGroupColor(group) {
  const s = GROUP_STYLES[group] || GROUP_STYLES.minor;
  return {background: s.bg, border: s.border};
}

function buildGraph() {
  const container = document.getElementById('graph-container');
  computedEdges = generateGraphEdges();

  nodesDS = new vis.DataSet(GRAPH_NODES.map(n => {
    const s = GROUP_STYLES[n.group] || GROUP_STYLES.minor;
    const isMinor = ['cap','minor','led','tp'].includes(n.group);
    return {
      ...n,
      shape: 'box',
      font: {size: s.font, color: '#fff', face: 'monospace'},
      color: getGroupColor(n.group),
      borderWidth: isMinor ? 1 : 2,
      margin: isMinor ? 4 : 8,
      widthConstraint: isMinor ? {minimum: 40} : {minimum: 70},
    };
  }));

  edgesDS = new vis.DataSet(computedEdges.map(e => ({
    ...e,
    width: 1.5,
    font: {size: 8, color: '#888', strokeWidth: 0, face: 'monospace'},
    color: {color: '#555', highlight: '#aaa'},
    arrows: '',
    smooth: {type: 'dynamic'},
  })));

  const options = {
    physics: { enabled: false },
    interaction: { hover: true, zoomView: true, dragView: true, dragNodes: true },
    nodes: { shape: 'box' },
    edges: { smooth: {enabled: true, type: 'dynamic'} },
  };

  network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, options);

  network.on('click', params => {
    if (params.edges.length > 0 && params.nodes.length === 0) {
      const edgeId = params.edges[0];
      const edge = computedEdges.find(e => e.id === edgeId);
      if (edge && edge.connIds.length > 0) selectConnection(edge.connIds[0]);
    } else if (params.nodes.length > 0) {
      const nodeId = params.nodes[0];
      const related = CONNECTIONS.filter(c => c.from === nodeId || c.to === nodeId);
      if (related.length > 0) selectConnection(related[0].id);
    }
  });
}

function getNodeStatus(nodeId) {
  const related = CONNECTIONS.filter(c => c.from === nodeId || c.to === nodeId);
  if (related.length === 0) return 'unchecked';
  const statuses = related.map(c => state[c.id]?.status || 'unchecked');
  if (statuses.some(s => s === 'flagged')) return 'flagged';
  if (statuses.every(s => s === 'approved')) return 'approved';
  if (statuses.some(s => s === 'approved')) return 'partial';
  return 'unchecked';
}

function updateGraphColors() {
  if (!nodesDS || !edgesDS) return;

  GRAPH_NODES.forEach(n => {
    const agg = getNodeStatus(n.id);
    const base = getGroupColor(n.group);
    const upd = { id: n.id };
    if (agg === 'approved') {
      upd.color = {background:'#0a3d1a', border:'#00e676', highlight:{background:'#0d4d20', border:'#69f0ae'}};
      upd.shadow = {enabled:true, color:'rgba(0,230,118,0.35)', size:12, x:0, y:0};
      upd.borderWidth = 3;
    } else if (agg === 'flagged') {
      upd.color = {background:'#4a0a0a', border:'#ff1744', highlight:{background:'#5a1010', border:'#ff5252'}};
      upd.shadow = {enabled:true, color:'rgba(255,23,68,0.45)', size:14, x:0, y:0};
      upd.borderWidth = 3;
    } else if (agg === 'partial') {
      upd.color = {background: base.background, border:'#ffc107', highlight:{background: base.background, border:'#ffd54f'}};
      upd.shadow = {enabled:true, color:'rgba(255,193,7,0.25)', size:8, x:0, y:0};
      upd.borderWidth = 2;
    } else {
      upd.color = base;
      upd.shadow = {enabled:false};
      upd.borderWidth = ['cap','minor','led','tp'].includes(n.group) ? 1 : 2;
    }
    nodesDS.update(upd);
  });

  computedEdges.forEach(e => {
    const statuses = e.connIds.map(id => state[id]?.status || 'unchecked');
    if (statuses.some(s => s === 'flagged')) {
      edgesDS.update({id:e.id, color:{color:'#ff1744',highlight:'#ff5252'}, width:3, shadow:{enabled:true,color:'rgba(255,23,68,0.4)',size:6}});
    } else if (statuses.every(s => s === 'approved')) {
      edgesDS.update({id:e.id, color:{color:'#00e676',highlight:'#69f0ae'}, width:3, shadow:{enabled:true,color:'rgba(0,230,118,0.3)',size:6}});
    } else if (statuses.some(s => s === 'approved')) {
      edgesDS.update({id:e.id, color:{color:'#ffc107',highlight:'#ffd54f'}, width:2, shadow:{enabled:false}});
    } else {
      edgesDS.update({id:e.id, color:{color:'#555',highlight:'#aaa'}, width:1.5, shadow:{enabled:false}});
    }
  });
}

function highlightGraphNode(conn) {
  if (!network) return;
  const nodeIdSet = new Set(GRAPH_NODES.map(n => n.id));
  const nodeIds = [conn.from, conn.to].filter(id => nodeIdSet.has(id));
  const uniqueNodes = [...new Set(nodeIds)];
  const edgeIds = computedEdges
    .filter(e => (uniqueNodes.includes(e.from) && uniqueNodes.includes(e.to)) ||
                 (uniqueNodes.length === 1 && (e.from === uniqueNodes[0] || e.to === uniqueNodes[0])))
    .map(e => e.id);
  if (uniqueNodes.length > 0 || edgeIds.length > 0) {
    network.setSelection({nodes: uniqueNodes, edges: edgeIds});
    if (uniqueNodes[0]) network.focus(uniqueNodes[0], {scale: 1.0, animation: {duration: 300}});
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// SAVE / LOAD
// ─────────────────────────────────────────────────────────────────────────────

function saveState() {
  const exportData = {
    version: '2.0',
    board: 'Switching Circuit V2',
    exportDate: new Date().toISOString(),
    totalConnections: CONNECTIONS.length,
    approved: CONNECTIONS.filter(c => state[c.id]?.status === 'approved').length,
    flagged: CONNECTIONS.filter(c => state[c.id]?.status === 'flagged').length,
    unchecked: CONNECTIONS.filter(c => (state[c.id]?.status || 'unchecked') === 'unchecked').length,
    connections: CONNECTIONS.map(c => ({
      id: c.id,
      group: c.group,
      label: c.label,
      from: c.from,
      fromPins: c.fromPins,
      to: c.to,
      toPins: c.toPins,
      net: c.net,
      rationale: c.rationale,
      specs: c.specs,
      status: state[c.id]?.status || 'unchecked',
      notes: state[c.id]?.notes || '',
    }))
  };

  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `scv2_verification_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function loadState(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.connections) {
        data.connections.forEach(c => {
          state[c.id] = { status: c.status || 'unchecked', notes: c.notes || '' };
        });
      } else {
        // Legacy format: direct state object
        Object.assign(state, data);
      }
      persistState();
      updateProgress();
      const filter = document.getElementById('filter-select').value;
      buildSidebar(filter);
      if (selectedId) selectConnection(selectedId);
    } catch(err) {
      alert('Failed to load: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ─────────────────────────────────────────────────────────────────────────────
// KEYBOARD NAV
// ─────────────────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  const items = [...document.querySelectorAll('.conn-item')];
  const currentIdx = items.findIndex(el => el.dataset.id === selectedId);

  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    const next = items[currentIdx + 1] || items[0];
    if (next) { selectConnection(next.dataset.id); next.scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    const prev = items[currentIdx - 1] || items[items.length - 1];
    if (prev) { selectConnection(prev.dataset.id); prev.scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'a' && selectedId) {
    setStatus('approved');
  } else if (e.key === 'f' && selectedId) {
    setStatus('flagged');
  } else if (e.key === 'r' && selectedId) {
    setStatus('unchecked');
  } else if (e.key === 'Escape') {
    closeDetail();
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────

initState();
buildFilterOptions();
buildSidebar('all');
buildGraph();
updateProgress();
updateGraphColors();
</script>
</body>
</html>
